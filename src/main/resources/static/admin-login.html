<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Admin Login</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235b97ff'/%3E%3Cstop offset='1' stop-color='%230f52ba'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M20 22h24l-2 24H22z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="container">
    <div class="brand"><span class="brand-mark"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span><span>Sales Savvy</span> <span class="tag">Admin</span></div>
    <h2>Admin Login</h2>
    <div class="demo-box">
  <span class="demo-title">Demo admin access</span>
  <p>Username: <strong>admin</strong> &nbsp;·&nbsp; Password: <strong>admin123</strong></p>
  <button type="button" class="btn-sm btn-ghost"
    onclick="document.getElementById('username').value='admin';document.getElementById('password').value='admin123';">
    Auto-fill
  </button>
</div>
    <form id="adminLoginForm">
      <input type="text" id="username" placeholder="Admin Username" autocomplete="username" required />
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit" data-burst>Login</button>
    </form>
    <p id="message"></p>
    <a href="/index.html">Back</a>
  </div>

  <script src="/js/effects.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
