<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0F52BA" />
  <title>Add Product</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235b97ff'/%3E%3Cstop offset='1' stop-color='%230f52ba'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M20 22h24l-2 24H22z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="container">
    <div class="brand"><span class="brand-mark"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span><span>Sales Savvy</span> <span class="tag">Admin</span></div>
    <h2>Add Product</h2>

    <form id="addProductForm">
      <input type="text" id="name" placeholder="Product Name" required />
      <input type="text" id="description" placeholder="Description" required />
      <div class="row2">
        <input type="number" id="price" step="0.01" placeholder="Price" required />
        <input type="number" id="stock" placeholder="Stock" required />
      </div>
      <input type="text" id="category" placeholder="Category" required />
      <input type="text" id="imageUrl" placeholder="Image URL" />
      <button type="submit" data-burst>Add Product</button>
    </form>

    <p id="message"></p>
    <a href="/admin-home.html">Back to Admin Home</a>
  </div>

  <script src="/js/effects.js"></script>
  <script src="/js/admin-products.js"></script>
</body>
</html>
