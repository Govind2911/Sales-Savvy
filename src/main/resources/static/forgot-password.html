<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0F52BA" />
  <title>Forgot Password</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235b97ff'/%3E%3Cstop offset='1' stop-color='%230f52ba'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M20 22h24l-2 24H22z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="container">
    <div class="brand"><span class="brand-mark"><svg class="" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span><span>Sales Savvy</span></div>
    <h2>Forgot Password</h2>
    <p>We'll email you a one-time code to reset it.</p>

    <form id="forgotPasswordForm">
      <input type="text" id="resetUsername" placeholder="Username / Email" required />
      <button type="submit" data-burst>Send OTP</button>
    </form>

    <form id="resetPasswordForm" style="display: none;">
      <input type="text" id="otp" placeholder="OTP" inputmode="numeric" autocomplete="one-time-code" required />
      <input type="password" id="newPassword" placeholder="New Password" autocomplete="new-password" required />
      <button type="submit" data-burst>Reset Password</button>
    </form>

    <p id="message"></p>
    <a href="/login.html">Back to login</a>
  </div>

  <script src="/js/effects.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
